name: Build OpenMRS Module

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Enable Corepack
      run: corepack enable

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'yarn'

    - name: Install dependencies
      run: yarn install --immutable

    - name: Build module
      run: yarn build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 30

    - name: Package module
      run: yarn pack --filename augen-auf-openmrs.tgz

    - name: Upload module package
      uses: actions/upload-artifact@v4
      with:
        name: augen-auf-openmrs-module
        path: augen-auf-openmrs.tgz
        retention-days: 30